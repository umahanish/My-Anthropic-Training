<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hash Tables — Flashcards</title>
<style>
  :root{
    --bg:#0d1117;
    --panel:#161b22;
    --edge:#2c333d;
    --ink:#e6edf3;
    --dim:#8b98a5;
    --mint:#5fe0a5;
    --amber:#f2b64c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--ink);
    font-family:'SF Mono', 'Menlo', 'Consolas', monospace;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }
  .eyebrow{
    color:var(--mint);
    font-size:12px;
    letter-spacing:.15em;
    text-transform:uppercase;
    margin-bottom:6px;
  }
  h1{
    font-size:20px;
    font-weight:600;
    margin:0 0 24px 0;
    color:var(--ink);
  }
  .progress{
    color:var(--dim);
    font-size:13px;
    margin-bottom:16px;
    letter-spacing:.05em;
  }
  .stage{
    width:100%;
    max-width:520px;
    perspective:1400px;
  }
  .card{
    position:relative;
    width:100%;
    height:280px;
    cursor:pointer;
  }
  .card-inner{
    position:relative;
    width:100%;
    height:100%;
    transition:transform .5s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;
  }
  .card.flipped .card-inner{
    transform:rotateY(180deg);
  }
  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    border-radius:14px;
    border:1px solid var(--edge);
    background:var(--panel);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:32px;
  }
  .face .tag{
    position:absolute;
    top:16px;
    left:18px;
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--dim);
  }
  .face.front .tag{color:var(--mint);}
  .face.back{
    transform:rotateY(180deg);
    background:#141a24;
    border-color:var(--mint);
  }
  .face.back .tag{color:var(--amber);}
  .q, .a{
    font-size:17px;
    line-height:1.5;
    color:var(--ink);
  }
  .a{color:#d6f5e6;}
  .hint{
    margin-top:18px;
    font-size:11px;
    color:var(--dim);
    letter-spacing:.05em;
  }
  .controls{
    display:flex;
    gap:12px;
    margin-top:22px;
  }
  button{
    font-family:inherit;
    font-size:13px;
    letter-spacing:.04em;
    background:var(--panel);
    color:var(--ink);
    border:1px solid var(--edge);
    border-radius:8px;
    padding:10px 16px;
    cursor:pointer;
    transition:border-color .15s, color .15s;
  }
  button:hover{
    border-color:var(--mint);
    color:var(--mint);
  }
  button.primary{
    border-color:var(--mint);
    color:var(--mint);
  }
  @media (max-width:480px){
    .card{height:320px;}
  }
</style>
</head>
<body>

  <div class="eyebrow">cs-flashcard-maker · demo deck</div>
  <h1>Hash Tables</h1>
  <div class="progress" id="progress">Card 1 / 6</div>

  <div class="stage">
    <div class="card" id="card">
      <div class="card-inner">
        <div class="face front">
          <span class="tag">Question</span>
          <div class="q" id="q"></div>
          <div class="hint">click to flip</div>
        </div>
        <div class="face back">
          <span class="tag">Answer</span>
          <div class="a" id="a"></div>
          <div class="hint">click to flip back</div>
        </div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="prev">← Prev</button>
    <button id="shuffle">⤮ Shuffle</button>
    <button id="next" class="primary">Next →</button>
  </div>

<script>
  const deck = [
    {q:"What is a hash collision?", a:"When two different keys hash to the same index/bucket in the table."},
    {q:"Average-case time complexity for a hash table lookup?", a:"O(1) — constant time, assuming a good hash function and low load factor."},
    {q:"Name two common collision-resolution strategies.", a:"Chaining (store a list per bucket) and open addressing (probe for the next free slot)."},
    {q:"What is the 'load factor' of a hash table?", a:"Number of entries divided by number of buckets — it signals when the table should resize."},
    {q:"Why do we resize a hash table when it gets too full?", a:"To keep the load factor low, which keeps lookups close to O(1) instead of degrading toward O(n)."},
    {q:"What makes a hash function 'good' for a hash table?", a:"It distributes keys uniformly across buckets and is fast to compute, minimizing collisions."}
  ];

  let order = deck.map((_, i) => i);
  let idx = 0;

  const cardEl = document.getElementById('card');
  const qEl = document.getElementById('q');
  const aEl = document.getElementById('a');
  const progEl = document.getElementById('progress');

  function render(){
    cardEl.classList.remove('flipped');
    const item = deck[order[idx]];
    qEl.textContent = item.q;
    aEl.textContent = item.a;
    progEl.textContent = `Card ${idx+1} / ${deck.length}`;
  }

  cardEl.addEventListener('click', () => cardEl.classList.toggle('flipped'));

  document.getElementById('next').addEventListener('click', () => {
    idx = (idx + 1) % deck.length;
    render();
  });
  document.getElementById('prev').addEventListener('click', () => {
    idx = (idx - 1 + deck.length) % deck.length;
    render();
  });
  document.getElementById('shuffle').addEventListener('click', () => {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    idx = 0;
    render();
  });

  render();
</script>
</body>
</html>
